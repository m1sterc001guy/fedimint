services:
  fedimintd:
    image: fedimint/fedimintd:v0.9.0-beta.0
    ports:
      - 8179:8179/tcp # p2p tls
      - 8179:8179/udp # p2p iroh
      - 8181:8181/udp # api iroh
      - 127.0.0.1:8182:8182/tcp # ui
    volumes:
      - fedimintd_data:/data
    environment:
      - FM_ENABLE_IROH=true
      - FM_BITCOIN_NETWORK=signet
      - FM_ESPLORA_URL=https://mutinynet.com/api
      - FM_BIND_P2P=0.0.0.0:8179
      - FM_BIND_API=0.0.0.0:8181
      - FM_BIND_UI=0.0.0.0:8182
    restart: always

volumes:
  fedimintd_data:
