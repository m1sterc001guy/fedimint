[package]
name = "fedimint-recurringd"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "fedimint-recurringd handles recurring lightning payments (e.g LNURL)"
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "fedimint-recurringd"
path = "src/main.rs"

[[bin]]
name = "recurringd-tests"
path = "src/tests.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
devimint = { workspace = true }
fedimint-core = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-lnv2-common = { workspace = true }
fedimint-logging = { workspace = true }
fedimint-rocksdb = { workspace = true }
lightning-invoice = { workspace = true }
lnurl-rs = { version = "0.9.0", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tpe = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
fedimint-build = { workspace = true }
