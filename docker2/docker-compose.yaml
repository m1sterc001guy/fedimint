services:
  fedimintd:
    image: fedimint/fedimintd:v0.9.0-beta.0
    ports:
      - 8176:8176/tcp # p2p tls
      - 8176:8176/udp # p2p iroh
      - 8177:8177/udp # api iroh
      - 127.0.0.1:8178:8178/tcp # ui
    volumes:
      - fedimintd_data:/data
    environment:
      - FM_ENABLE_IROH=true
      - FM_BITCOIN_NETWORK=signet
      - FM_ESPLORA_URL=https://mutinynet.com/api
      - FM_BIND_P2P=0.0.0.0:8176
      - FM_BIND_API=0.0.0.0:8177
      - FM_BIND_UI=0.0.0.0:8178
    restart: always

volumes:
  fedimintd_data:
